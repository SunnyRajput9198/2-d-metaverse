services:
  postgres:
    image: postgres:17
    container_name: metaspace-postgres
    environment:
      POSTGRES_DB: metaspace
      POSTGRES_USER: metaspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - metaspace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaspace -d metaspace"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - devnet

  livekit:
    image: livekit/livekit-server:latest
    container_name: dev-livekit
    ports:
      - "7880:7880"   # HTTP API
      - "7881:7881"   # WebRTC over TCP
      - "7882:7882/udp"  # WebRTC over UDP
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    command: --dev --bind 0.0.0.0
    networks:
      - devnet
    restart: unless-stopped

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile.dev
    container_name: dev-ws
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://metaspace:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/metaspace
      JWT_PASSWORD: ${JWT_PASSWORD:?Set JWT_PASSWORD in the environment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    networks:
      - devnet
    restart: unless-stopped

  http:
    build:
      context: .
      dockerfile: apps/http/Dockerfile.dev
    container_name: dev-http
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://metaspace:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/metaspace
      JWT_PASSWORD: ${JWT_PASSWORD:?Set JWT_PASSWORD in the environment}
      ADMIN_SIGNUP_SECRET: ${ADMIN_SIGNUP_SECRET:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      LIVEKIT_URL: "ws://localhost:7880"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    networks:
      - devnet
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: dev-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: "http://localhost:3000"
      VITE_WS_URL: "ws://localhost:3001"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - http
      - ws
      - livekit
    networks:
      - devnet
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/http/Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://metaspace:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/metaspace
    working_dir: /app
    command: ["bunx", "prisma", "migrate", "deploy", "--schema=packages/db/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devnet
    restart: "no"

networks:
  devnet:

volumes:
  metaspace-postgres-data:
